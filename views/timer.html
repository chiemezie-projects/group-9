<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Workout timer - time your exercises">
  <title>Timer | Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/dashboard" class="logo">💪 <span>FitTrack</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/dashboard">Dashboard</a></li>
      <li><a href="/workouts">Workouts</a></li>
      <li><a href="/timer" class="active">Timer</a></li>
      <li><a href="/progress">Progress</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><a href="#" class="btn-logout" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="page-header" style="text-align:center;">
      <h1>Workout Timer</h1>
      <p>Select a workout and start your countdown</p>
    </div>

    <div class="timer-wrapper">
      <!-- Workout Selector -->
      <div class="timer-workout-select">
        <div class="form-group">
          <label for="timerWorkout">Select Workout</label>
          <select id="timerWorkout">
            <option value="">Choose a workout...</option>
          </select>
        </div>
      </div>

      <!-- Timer Display -->
      <div class="timer-display" id="timerDisplay">
        <span class="timer-text" id="timerText">00:00</span>
      </div>

      <!-- Timer Controls -->
      <div class="timer-controls">
        <button class="btn btn-success" id="startBtn">▶ Start</button>
        <button class="btn btn-secondary" id="pauseBtn" disabled>⏸ Pause</button>
        <button class="btn btn-danger" id="resetBtn">⟲ Reset</button>
      </div>

      <!-- Manual Timer Setup -->
      <div class="timer-setup">
        <h3>Custom Timer</h3>
        <div class="timer-input-row">
          <div class="form-group">
            <label for="timerMinutes">Minutes</label>
            <input type="number" id="timerMinutes" value="10" min="0" max="120">
          </div>
          <div class="form-group">
            <label for="timerSeconds">Seconds</label>
            <input type="number" id="timerSeconds" value="0" min="0" max="59">
          </div>
          <button class="btn btn-secondary btn-sm" id="setTimerBtn" style="margin-bottom:0;height:44px;">Set</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/timer.js"></script>
</body>
</html>
