<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your workout dashboard - view schedule and progress">
  <title>Dashboard | Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/dashboard" class="logo">💪 <span>FitTrack</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/dashboard" class="active">Dashboard</a></li>
      <li><a href="/workouts">Workouts</a></li>
      <li><a href="/timer">Timer</a></li>
      <li><a href="/progress">Progress</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><a href="#" class="btn-logout" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <div class="container">
    <!-- Page Header -->
    <div class="page-header">
      <h1>Dashboard</h1>
      <p>Welcome back, <span id="userName">User</span>! Here's your weekly overview.</p>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon">🏋️</div>
        <div class="stat-value" id="totalWorkouts">0</div>
        <div class="stat-label">Total Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value" id="currentStreak">0</div>
        <div class="stat-label">Day Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="weeklyCount">0</div>
        <div class="stat-label">This Week</div>
      </div>
    </div>

    <!-- Weekly Schedule -->
    <div class="section-header">
      <h2>Weekly Schedule</h2>
      <a href="/workouts" class="btn btn-secondary btn-sm">Manage Workouts</a>
    </div>

    <div class="schedule-grid" id="scheduleGrid">
      <!-- Populated by JavaScript -->
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    /**
     * Dashboard Page Logic
     * Loads user info, progress stats, and weekly schedule on page load.
     */

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Load user info
        const userRes = await fetch('/api/me');
        if (!userRes.ok) { window.location.href = '/login'; return; }
        const userData = await userRes.json();
        document.getElementById('userName').textContent = userData.user.name.split(' ')[0];
        document.getElementById('navUser').textContent = userData.user.name;

        // Load progress stats
        const progressRes = await fetch('/api/progress');
        if (progressRes.ok) {
          const stats = await progressRes.json();
          document.getElementById('totalWorkouts').textContent = stats.totalWorkouts;
          document.getElementById('currentStreak').textContent = stats.currentStreak;
          document.getElementById('weeklyCount').textContent = stats.weeklyCount;
        }

        // Load weekly schedule
        const workoutRes = await fetch('/api/workouts');
        if (workoutRes.ok) {
          const workouts = await workoutRes.json();
          renderSchedule(workouts);
        }
      } catch (error) {
        console.error('Error loading dashboard:', error);
      }
    });

    /**
     * Render the weekly schedule grid
     */
    function renderSchedule(workouts) {
      const grid = document.getElementById('scheduleGrid');
      const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      const today = days[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];

      grid.innerHTML = days.map(day => {
        const dayWorkouts = workouts.filter(w => w.dayOfWeek === day);
        const isToday = day === today;

        return `
          <div class="schedule-day ${isToday ? 'today' : ''}">
            <div class="day-name">${day.slice(0, 3)}</div>
            ${dayWorkouts.length > 0
              ? dayWorkouts.map(w => `
                  <div class="day-workout">
                    <span class="category-badge ${w.category.toLowerCase()}">${w.category}</span>
                  </div>
                `).join('')
              : '<div class="day-workout rest">Rest</div>'
            }
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
