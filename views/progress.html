<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your workout progress and statistics">
  <title>Progress | Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/dashboard" class="logo">💪 <span>FitTrack</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/dashboard">Dashboard</a></li>
      <li><a href="/workouts">Workouts</a></li>
      <li><a href="/timer">Timer</a></li>
      <li><a href="/progress" class="active">Progress</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><a href="#" class="btn-logout" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>Your Progress</h1>
      <p>Track your workout achievements and streaks</p>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🏋️</div>
        <div class="stat-value" id="totalWorkouts">0</div>
        <div class="stat-label">Total Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value" id="currentStreak">0</div>
        <div class="stat-label">Day Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="weeklyCount">0</div>
        <div class="stat-label">This Week</div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="recent-activity">
      <div class="section-header">
        <h2>Recent Activity</h2>
      </div>
      <div class="activity-list" id="activityList">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/progress.js"></script>
</body>
</html>
